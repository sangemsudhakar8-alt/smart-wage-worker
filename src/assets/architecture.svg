<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8" />
    </marker>
  </defs>

  <!-- Title Section -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="1">SMART WAGE WORKER - SYSTEM ARCHITECTURE</text>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">Multilingual Voice Navigation • Real-time Geo-Fencing • Firebase Cloud Infrastructure</text>

  <!-- Container Box 1: Presentation & Client Layer -->
  <rect x="40" y="100" width="920" height="175" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="55" y="85" width="220" height="28" rx="6" fill="url(#primaryGrad)" />
  <text x="165" y="104" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1. FRONTEND / CLIENT LAYER</text>

  <!-- Client Layer Cards -->
  <g transform="translate(60, 130)">
    <!-- Card A: Web Application -->
    <rect x="0" y="0" width="200" height="125" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" fill="#a5b4fc" font-size="13" font-weight="700">React 19 SPA (Vite)</text>
    <text x="100" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Worker &amp; Employer Views</text>
    <text x="100" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">PWA Service Worker</text>
    <text x="100" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">Lucide UI &amp; Dynamic CSS</text>
    <rect x="25" y="100" width="150" height="18" rx="4" fill="rgba(99,102,241,0.2)" />
    <text x="100" y="113" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="600">Localhost:5173 / Vercel</text>
  </g>

  <g transform="translate(280, 130)">
    <!-- Card B: Voice & Multilingual Engine -->
    <rect x="0" y="0" width="210" height="125" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
    <text x="105" y="25" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">Voice Assistant &amp; i18n</text>
    <text x="105" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Web Speech Recognition</text>
    <text x="105" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">SpeechSynthesis TTS Engine</text>
    <text x="105" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">Telugu, Hindi &amp; English</text>
    <rect x="25" y="100" width="160" height="18" rx="4" fill="rgba(59,130,246,0.2)" />
    <text x="105" y="113" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">VoiceContext &amp; VoiceCaption</text>
  </g>

  <g transform="translate(510, 130)">
    <!-- Card C: Geo-Location & Maps -->
    <rect x="0" y="0" width="200" height="125" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="100" y="25" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Geo-Fencing &amp; Maps</text>
    <text x="100" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Leaflet Interactive Map</text>
    <text x="100" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Haversine Geo Math</text>
    <text x="100" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">Live Proximity Alerts</text>
    <rect x="25" y="100" width="150" height="18" rx="4" fill="rgba(16,185,129,0.2)" />
    <text x="100" y="113" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">useGeoTracking Hook</text>
  </g>

  <g transform="translate(730, 130)">
    <!-- Card D: QR Scanner & Analytics -->
    <rect x="0" y="0" width="210" height="125" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
    <text x="105" y="25" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="700">Attendance &amp; Analytics</text>
    <text x="105" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">HTML5 Camera Scanner</text>
    <text x="105" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Worker Trust Score (100%)</text>
    <text x="105" y="88" text-anchor="middle" fill="#cbd5e1" font-size="11">Earnings &amp; Badge Graphs</text>
    <rect x="25" y="100" width="160" height="18" rx="4" fill="rgba(139,92,246,0.2)" />
    <text x="105" y="113" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Worker &amp; Employer Dashboards</text>
  </g>

  <!-- Connectors from Layer 1 to Layer 2 -->
  <line x1="500" y1="275" x2="500" y2="315" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- Container Box 2: Express Backend Server Layer -->
  <rect x="40" y="320" width="920" height="160" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="55" y="305" width="220" height="28" rx="6" fill="url(#accentGrad)" />
  <text x="165" y="324" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2. EXPRESS API BACKEND SERVER</text>

  <g transform="translate(70, 350)">
    <!-- Express Server Details -->
    <rect x="0" y="0" width="260" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="130" y="25" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="700">Express REST Controller</text>
    <text x="130" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Node.js ES Modules Server</text>
    <text x="130" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">CORS &amp; Dotenv Configuration</text>
    <rect x="30" y="82" width="200" height="18" rx="4" fill="rgba(56,189,248,0.2)" />
    <text x="130" y="95" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">http://localhost:5000/api</text>
  </g>

  <g transform="translate(360, 350)">
    <!-- API Routes & Auth -->
    <rect x="0" y="0" width="280" height="110" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" />
    <text x="140" y="25" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="700">API Routes &amp; Middleware</text>
    <text x="140" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">/auth, /jobs, /applications, /attendance</text>
    <text x="140" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">/geofence, /stats, /reviews, /leaves</text>
    <rect x="30" y="82" width="220" height="18" rx="4" fill="rgba(96,165,250,0.2)" />
    <text x="140" y="95" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">Bearer Token Auth Middleware</text>
  </g>

  <g transform="translate(670, 350)">
    <!-- Fallback & Services -->
    <rect x="0" y="0" width="260" height="110" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
    <text x="130" y="25" text-anchor="middle" fill="#fbcfe8" font-size="13" font-weight="700">Resilient Services</text>
    <text x="130" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Mock OTP Dev Fallback Mode</text>
    <text x="130" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Geo Fence Radius Validation</text>
    <rect x="30" y="82" width="200" height="18" rx="4" fill="rgba(244,114,182,0.2)" />
    <text x="130" y="95" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="600">Trust Scoring Calculator</text>
  </g>

  <!-- Connectors from Layer 2 to Layer 3 -->
  <line x1="500" y1="480" x2="500" y2="520" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- Container Box 3: Database & Cloud Services Layer -->
  <rect x="40" y="525" width="920" height="145" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <rect x="55" y="510" width="220" height="28" rx="6" fill="url(#successGrad)" />
  <text x="165" y="529" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">3. FIREBASE CLOUD SERVICES</text>

  <g transform="translate(80, 550)">
    <!-- Firebase Auth -->
    <rect x="0" y="0" width="260" height="95" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
    <text x="130" y="25" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">Firebase Authentication</text>
    <text x="130" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Phone SMS &amp; ReCAPTCHA</text>
    <text x="130" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Mock OTP Fallback (123456)</text>
  </g>

  <g transform="translate(370, 550)">
    <!-- Cloud Firestore Database -->
    <rect x="0" y="0" width="260" height="95" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
    <text x="130" y="25" text-anchor="middle" fill="#6ee7b7" font-size="13" font-weight="700">Cloud Firestore (NoSQL)</text>
    <text x="130" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">Users, Jobs, Applications</text>
    <text x="130" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Attendance, GeoFence Logs</text>
  </g>

  <g transform="translate(660, 550)">
    <!-- Firebase Admin & Storage -->
    <rect x="0" y="0" width="260" height="95" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5" />
    <text x="130" y="25" text-anchor="middle" fill="#67e8f9" font-size="13" font-weight="700">Admin SDK &amp; Storage</text>
    <text x="130" y="48" text-anchor="middle" fill="#cbd5e1" font-size="11">serviceAccountKey Integration</text>
    <text x="130" y="68" text-anchor="middle" fill="#cbd5e1" font-size="11">Cloud Storage for Avatars</text>
  </g>
</svg>
